version: "3.9"

# ============================================================
# Fitness Hub - dev local
# Sobe Postgres + Backend juntos
# Em produção, use o Neon (PostgreSQL serverless)
# ============================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitnesshub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://fitness:fitness@db:5432/fitnesshub
      JWT_SECRET: dev-secret-change-me-in-production-please-32-chars-min
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
