<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Fitness Hub</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <a href="login.html" class="topbar-logo">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/>
          <circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
          <circle cx="12" cy="12" r="2.2"/>
          <line x1="6" y1="6" x2="12" y2="12"/><line x1="18" y1="6" x2="12" y2="12"/>
          <line x1="6" y1="18" x2="12" y2="12"/><line x1="18" y1="18" x2="12" y2="12"/>
        </svg>
      </div>
      <span class="name">Fitness Hub</span>
    </a>

    <nav class="topbar-links" aria-label="Navegação principal">
      <a href="#" class="hide-sm">Sobre</a>
      <a href="#" class="hide-sm">Recursos</a>
      <a href="login.html" class="primary">Entrar</a>
    </nav>
  </header>

  <!-- Center -->
  <main class="center">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Criar uma conta</h1>
        <p>Comece sua jornada fitness. É gratuito.</p>
      </div>

      <div id="form-error" class="form-error" role="alert" aria-live="polite" hidden></div>

      <form id="register-form" class="form" novalidate>
        <div class="field">
          <label for="reg-user">Usuário</label>
          <div class="field-input">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input
              type="text"
              id="reg-user"
              name="username"
              placeholder="seu.usuario"
              autocomplete="username"
              minlength="3"
              maxlength="50"
              pattern="[a-zA-Z0-9_.]+"
              required
            >
          </div>
          <span class="field-hint" id="hint-user">Use letras, números, ponto ou underline. 3-50 caracteres.</span>
        </div>

        <div class="field">
          <label for="reg-email">Email</label>
          <div class="field-input">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="reg-email" name="email" placeholder="seu@email.com" autocomplete="email" maxlength="255" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-pass">Senha</label>
          <div class="field-input">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="reg-pass" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
            <div class="trailing">
              <button type="button" data-toggle-password="reg-pass" aria-label="Mostrar ou ocultar senha">
                <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <span class="field-hint" id="hint-pass">Mínimo 8 caracteres.</span>
        </div>

        <label class="check">
          <input type="checkbox" name="accept_terms" required>
          <span class="check-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
          </span>
          <span>Eu aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a></span>
        </label>

        <button type="submit" class="btn btn-secondary">
          <span class="btn-label">Criar conta</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider"><span>ou cadastre-se com</span></div>

      <div class="social">
        <button type="button" class="social-btn" data-social="google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.22-4.74 3.22-8.32z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social-btn" data-social="apple">
          <svg viewBox="0 0 24 24" fill="#18181B" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Apple
        </button>
      </div>

      <div class="switch">
        Já tem conta? <a href="login.html">Entrar</a>
      </div>
    </div>
  </main>

  <footer class="webpage-foot">
    <a href="#">Termos</a> · <a href="#">Privacidade</a> · <a href="#">Suporte</a>
    <div class="copyright">© 2026 Fitness Hub</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
