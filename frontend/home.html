<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Fitness Hub</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/social.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-logo">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/>
          <circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
          <circle cx="12" cy="12" r="2.2"/>
          <line x1="6" y1="6" x2="12" y2="12"/><line x1="18" y1="6" x2="12" y2="12"/>
          <line x1="6" y1="18" x2="12" y2="12"/><line x1="18" y1="18" x2="12" y2="12"/>
        </svg>
      </div>
      <span class="name">Fitness Hub</span>
    </a>
    <nav class="topbar-links">
      <a href="#" id="logout-link">Sair</a>
    </nav>
  </header>

  <!-- Tab nav -->
  <nav class="tabs-nav" aria-label="Navegação principal">
    <a href="home.html" class="active" data-tab="home">Home</a>
    <a href="feed.html" data-tab="feed">Feed</a>
    <a href="dieta.html" data-tab="dieta">Dieta</a>
  </nav>

  <main class="social-main">
    <div id="profile-container">
      <p class="feed-empty">Carregando perfil...</p>
    </div>
  </main>

  <!-- Modal: Editar perfil -->
  <div class="modal-overlay" id="edit-modal" hidden>
    <div class="modal-content">
      <h2>Editar perfil</h2>
      <label style="font-size: 13px; color: #52525B; font-weight: 600;">Nome completo</label>
      <input type="text" id="edit-nome" maxlength="100">
      <label style="font-size: 13px; color: #52525B; font-weight: 600;">Bio</label>
      <textarea id="edit-bio" maxlength="500" placeholder="Conte um pouco sobre você..."></textarea>
      <label class="check" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #52525B;">
        <input type="checkbox" id="edit-private">
        <span class="check-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
        </span>
        <span>Conta privada (apenas seguidores aceitos veem posts)</span>
      </label>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-edit">Cancelar</button>
        <button class="btn-save" id="btn-save-edit">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
